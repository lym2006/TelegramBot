# ============================================================
# Fool's Telegram Bot - 配置模板
# 使用说明：复制本文件为 config.toml，并填入你的真实配置
# ============================================================

# ---------- 全局设置 ----------
[global]
# 代理地址
# 例如: http://127.0.0.1:7890，不需要可留空
proxy = "http://127.0.0.1:port"

# Telegram Bot Token
# 从 @BotFather 获取的机器人凭证，必填
telegram_token = "123456:abcdefgh"

# 网络数据传输超时
# 单位：秒，控制读取响应、写入请求及连接池等待的最大耗时
network_timeout = 90.0

# ---------- AI 模型设置 ----------
[ai]
# AI 模型名称
# 从 Siliconflow 的模型广场获取，例如: Pro/deepseek-ai/DeepSeek-R1
model_name = "Pro/deepseek-ai/DeepSeek-R1"

# AI API Key
# 在 Siliconflow 自行创建并填入
api_key = "sk-xxxxxxxxxxxx"

# 温度参数
# 取值范围 0~2，越高越有创造性，越低越稳定
temperature = 0.7

# ---------- 触发与人设 ----------
[chore]
# 群聊触发关键词列表
# 用逗号分隔，例如: AI, Bot。用户消息包含时（如 @Bot）触发 AI 回复
triggers = ["1", "2"]

# 默认人格设定
# 用于定义机器人的性格和行为，支持多行文本（建议使用默认）
personality = """
重要：若无必要，只能使用简体中文和英语，优先使用用户的语言。
使用Markdown格式回复，严禁使用与Markdown语法冲突的字符。
在表达情绪、强调重点或增加可读性时，请适量使用emoji。
再次强调：不要随意编造你的身份和能力。
"""

# ---------- 数据与运维 ----------
[data]
# 数据清理间隔
# 单位：小时，定期清理过期的会话数据
clearup = 6.0

# 检测等待间隔
# 单位：小时，间隔多久检测一次后台任务
waiting = 0.5